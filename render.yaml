# Prime Dreems — Render Blueprint (1-click deploy from Git)
# Deploy: https://render.com/deploy?repo=<your-git-repo-url>
# Both services build & start automatically; the frontend proxies API + uploads
# to the backend via same-origin rewrites (no CORS / public API URL needed).
services:
  # ─── BACKEND API SERVICE ───
  - type: web
    name: prime-dreems-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://prime-dreems-frontend.onrender.com

  # ─── FRONTEND NEXT.JS WEB APP ───
  - type: web
    name: prime-dreems-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Server-side rewrite target for /api-backend/* and /uploads/*
      - key: BACKEND_URL
        value: https://prime-dreems-backend.onrender.com